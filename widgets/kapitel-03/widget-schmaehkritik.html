<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmähkritik-Thermometer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            margin: 30px 0;
            accent-color: #ff6a00;
        }

        .display {
            min-height: 150px;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.5s;
        }

        h2 {
            margin: 0;
            color: #ff6a00;
            font-size: 1.5rem;
        }

        .quote {
            font-style: italic;
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .legal-note {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <input type="range" id="slider" min="0" max="2" step="1" value="0">
        <div id="display" class="display">
            <h2 id="title">Sachliche Kritik</h2>
            <div id="quote" class="quote">"Die Argumente des Autors sind fachlich nicht haltbar."</div>
            <div id="legal" class="legal-note">Abwägung: Weitgehender Schutz durch Art. 5 I GG.</div>
        </div>
    </div>

    <script>
        const levels = [
            {
                title: "Sachliche Kritik",
                quote: '"Die Argumente des Autors sind fachlich nicht haltbar."',
                legal: "Abwägung: Weitgehender Schutz durch Art. 5 I GG. Fokus liegt auf der Sache.",
                color: "#e6ffed"
            },
            {
                title: "Zuspitzung / Polemik",
                quote: '"Das ist der größte Unsinn, den ich je in dieser Zeitung gelesen habe!"',
                legal: "Abwägung: Noch geschützt. Zuspitzung und emotionale Wortwahl sind zulässig.",
                color: "#fff9e6"
            },
            {
                title: "Schmähkritik",
                quote: '"Dieser Autor ist ein charakterloses Schwein, dem es nur um Zerstörung geht."',
                legal: "Keine Abwägung mehr: Die Diffamierung der Person steht im Vordergrund. Art. 5 tritt zurück.",
                color: "#fff5f5"
            }
        ];

        const slider = document.getElementById('slider');
        const display = document.getElementById('display');
        const title = document.getElementById('title');
        const quote = document.getElementById('quote');
        const legal = document.getElementById('legal');

        slider.addEventListener('input', () => {
            const val = slider.value;
            const data = levels[val];
            title.textContent = data.title;
            quote.textContent = data.quote;
            legal.textContent = data.legal;
            display.style.backgroundColor = data.color;
            display.style.borderColor = val == 2 ? '#ff6a00' : '#ddd';
        });
    </script>
</body>

</html>

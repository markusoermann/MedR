<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKG vs. DDG Split</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .zones {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .zone {
            flex: 1;
            min-height: 150px;
            background: #f8f9fa;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.3s;
        }

        .zone.over {
            border-color: #ff6a00;
            background: #fff3e6;
        }

        .zone h3 {
            margin-top: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .item {
            padding: 8px 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: move;
            font-size: 0.85rem;
            user-select: none;
        }

        .item.correct {
            background: #e6fcf5;
            border-color: #28a745;
        }

        .item.wrong {
            background: #fff5f5;
            border-color: #dc3545;
        }

        .feedback {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="zones">
            <div class="zone" id="tkg" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="enter(event)"
                ondragleave="leave(event)">
                <h3>TKG (Transport)</h3>
                <div class="content"></div>
            </div>
            <div class="zone" id="ddg" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="enter(event)"
                ondragleave="leave(event)">
                <h3>DDG/MStV (Inhalt)</h3>
                <div class="content"></div>
            </div>
        </div>

        <div class="items" id="item-list">
            <div class="item" draggable="true" ondragstart="drag(event)" id="i1" data-cat="tkg">Glasfaserkabel</div>
            <div class="item" draggable="true" ondragstart="drag(event)" id="i2" data-cat="ddg">Streaming-App</div>
            <div class="item" draggable="true" ondragstart="drag(event)" id="i3" data-cat="tkg">Signalübertragung</div>
            <div class="item" draggable="true" ondragstart="drag(event)" id="i4" data-cat="ddg">Social Media Feed</div>
            <div class="item" draggable="true" ondragstart="drag(event)" id="i5" data-cat="tkg">Mobilfunkmasten</div>
            <div class="item" draggable="true" ondragstart="drag(event)" id="i6" data-cat="ddg">Online-Artikel</div>
        </div>

        <div class="feedback" id="feedback">Ordnen Sie die Begriffe zu!</div>
    </div>

    <script>
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function enter(ev) { if (ev.target.classList.contains('zone')) ev.target.classList.add('over'); }
        function leave(ev) { if (ev.target.classList.contains('zone')) ev.target.classList.remove('over'); }

        function drop(ev) {
            ev.preventDefault();
            const zone = ev.target.closest('.zone');
            zone.classList.remove('over');
            const id = ev.dataTransfer.getData("text");
            const el = document.getElementById(id);
            const targetCat = zone.id;
            const correctCat = el.getAttribute('data-cat');

            if (targetCat === correctCat) {
                zone.querySelector('.content').appendChild(el);
                el.classList.add('correct');
                el.draggable = false;
                document.getElementById('feedback').textContent = "Richtig!";
                document.getElementById('feedback').style.color = "#28a745";
            } else {
                el.classList.add('wrong');
                document.getElementById('feedback').textContent = "Falsche Ebene!";
                document.getElementById('feedback').style.color = "#dc3545";
                setTimeout(() => el.classList.remove('wrong'), 1000);
            }
        }
    </script>
</body>

</html>
